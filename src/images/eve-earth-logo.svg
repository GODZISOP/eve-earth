  <g transform="translate(210, 256)">
    <line x1="-108" y1="-4" x2="-66" y2="-4" stroke="#175228" stroke-width="2" stroke-linecap="round" />
    <text x="0" y="0"
          text-anchor="middle"
          font-family="'Plus Jakarta Sans', system-ui, sans-serif"
          font-size="11.5"
          font-weight="700"
          fill="#175228"
          letter-spacing="3.5">
