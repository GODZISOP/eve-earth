<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" fill="none">
  <defs>
    <linearGradient id="evePine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e8c4b" />
      <stop offset="50%" stop-color="#175228" />
      <stop offset="100%" stop-color="#0f381b" />
    </linearGradient>
    <linearGradient id="eveSage" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2b6b39" />
      <stop offset="55%" stop-color="#69ab5e" />
      <stop offset="100%" stop-color="#b8e29f" />
    </linearGradient>
    <linearGradient id="eveObsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d3221" />
      <stop offset="55%" stop-color="#122116" />
      <stop offset="100%" stop-color="#0a140d" />
    </linearGradient>
    <filter id="eveShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0a140d" flood-opacity="0.22" />
    </filter>
  </defs>

  <g transform="translate(120, 14)" filter="url(#eveShadow)">
    <circle cx="90" cy="90" r="82" fill="url(#eveObsidian)" stroke="url(#eveSage)" stroke-width="3.5" />
    <circle cx="90" cy="90" r="70" fill="none" stroke="url(#eveSage)" stroke-width="1" stroke-dasharray="3 4" opacity="0.55" />
    <ellipse cx="90" cy="90" rx="34" ry="68" fill="none" stroke="url(#evePine)" stroke-width="2" opacity="0.7" />
    <path d="M 24 96 Q 90 120 156 96" fill="none" stroke="url(#eveSage)" stroke-width="2.2" opacity="0.85" />
    <path d="M 32 66 Q 90 48 148 66" fill="none" stroke="url(#evePine)" stroke-width="1.6" opacity="0.6" />
    <path d="M 90 38 C 118 52, 128 84, 90 132 C 52 84, 62 52, 90 38 Z" fill="url(#evePine)" stroke="url(#eveSage)" stroke-width="2" />
    <path d="M 90 48 L 90 132" stroke="#f6f9f4" stroke-width="2.5" stroke-linecap="round" opacity="0.92" />
    <path d="M 90 74 L 106 64 M 90 92 L 108 82 M 90 74 L 74 64 M 90 92 L 72 82" stroke="#f6f9f4" stroke-width="2" stroke-linecap="round" opacity="0.82" />
    <path d="M 12 112 C 42 156, 138 156, 168 104 C 138 134, 48 134, 18 106 Z" fill="url(#eveSage)" opacity="0.95" />
    <polygon points="90,14 93,22 101,25 93,28 90,36 87,28 79,25 87,22" fill="url(#eveSage)" />
  </g>

  <text x="210" y="226"
        text-anchor="middle"
        font-family="'Plus Jakarta Sans', system-ui, sans-serif"
        font-size="34"
        font-weight="800"
        fill="#132417"
        letter-spacing="5">
